<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - Refer & Earn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel {
            background: rgba(13, 17, 28, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen p-4 pb-24 flex flex-col justify-between">

    <div class="max-w-md mx-auto w-full space-y-6">
        <!-- Top Navigation Bar -->
        <header class="glass-panel rounded-2xl px-4 py-3.5 flex items-center justify-between border border-slate-800">
            <button onclick="window.location.href='dashboard.html'" class="text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1">← Back to Lobby</button>
            <h1 class="text-xs font-black text-white uppercase tracking-wider">Refer & Earn</h1>
        </header>

        <!-- Referral Banner -->
        <div class="glass-panel rounded-3xl p-6 border border-slate-800 text-center relative overflow-hidden">
            <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-emerald-600 to-teal-500 mx-auto flex items-center justify-center font-black text-2xl text-white shadow-xl shadow-emerald-600/30 border border-white/10 mb-3">🎁</div>
            <h2 class="text-sm font-black text-white tracking-wide uppercase">Invite Friends & Earn Cash</h2>
            <p class="text-[11px] text-slate-400 font-medium mt-1">Get 5% commission on every deposit made by your referred friends instantly.</p>
        </div>

        <!-- Referral Link Section -->
        <div class="glass-panel rounded-3xl p-5 border border-slate-800 space-y-4">
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1.5">Your Unique Referral Link</label>
                <div class="flex items-center bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3">
                    <input type="text" id="refLinkInput" readonly class="w-full bg-transparent text-xs text-indigo-400 font-semibold focus:outline-none select-all" value="Loading link...">
                </div>
            </div>

            <button onclick="copyRefLink()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-emerald-600/30 transition-all active:scale-[0.98]">
                Copy Referral Link
            </button>
        </div>

        <!-- Stats Overview -->
        <div class="grid grid-cols-2 gap-3">
            <div class="glass-panel rounded-3xl p-4 text-center border border-slate-800">
                <span class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Total Referrals</span>
                <span id="totalRefs" class="text-sm font-black text-white">0</span>
            </div>
            <div class="glass-panel rounded-3xl p-4 text-center border border-slate-800">
                <span class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Total Earned</span>
                <span id="totalEarned" class="text-sm font-black text-emerald-400">₹0.00</span>
            </div>
        </div>
    </div>

    <!-- Firebase Referral Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ",
            authDomain: "nexuswin-aa829.firebaseapp.com",
            databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com",
            projectId: "nexuswin-aa829",
            storageBucket: "nexuswin-aa829.firebasestorage.app",
            messagingSenderId: "865579357605",
            appId: "1:865579357605:web:7af15e869ce54756a8844c",
            measurementId: "G-NTZY5VKYP0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const refUrl = `${window.location.origin}/index.html?ref=${user.uid}`;
                document.getElementById('refLinkInput').value = refUrl;
            } else {
                window.location.href = "index.html";
            }
        });

        window.copyRefLink = function() {
            const input = document.getElementById('refLinkInput');
            input.select();
            input.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(input.value);
            alert("Referral link copied to clipboard!");
        }
    </script>

</html>
