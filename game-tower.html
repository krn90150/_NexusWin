<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - VIP Tower Royal Climb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #060913; color: #fff; user-select: none; }
        .royal-panel { background: linear-gradient(135deg, #111827 0%, #060913 100%); border: 1px solid rgba(245, 158, 11, 0.25); box-shadow: 0 0 30px rgba(245, 158, 11, 0.08); }
        .tower-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }
        .tower-tile {
            height: 44px;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            color: #fbbf24;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tower-tile.active:hover:not(:disabled) {
            border-color: #fbbf24;
            background: rgba(245, 158, 11, 0.15);
            transform: translateY(-1px);
        }
        .tower-tile.revealed-safe {
            background: radial-gradient(circle, #065f46 0%, #022c22 100%);
            border-color: #34d399;
            color: #34d399;
        }
        .tower-tile.revealed-trap {
            background: radial-gradient(circle, #991b1b 0%, #450a0a 100%);
            border-color: #f87171;
            color: #f87171;
        }
        .tower-tile.disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        
        /* --- TUTORIAL POPUP MODAL --- */
        #tutorial-modal {
            position: fixed;
            inset: 0;
            background: rgba(6, 9, 19, 0.85);
            backdrop-filter: blur(8px);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        #tutorial-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        @keyframes vipSlideDown {
            0% { transform: translateY(-120%) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes vipSlideUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120%) scale(0.9); opacity: 0; }
        }
        .vip-toast-enter { animation: vipSlideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .vip-toast-exit { animation: vipSlideUp 0.3s ease-in forwards; }
    </style>
</head>
<body class="min-h-screen pb-28 flex flex-col justify-between">

    <!-- Tutorial Guide Modal on Entry -->
    <div id="tutorial-modal" class="show">
        <div class="royal-panel rounded-3xl p-6 max-w-xs w-full text-center space-y-4 shadow-2xl border border-amber-500/50">
            <div class="w-14 h-14 mx-auto bg-amber-500/20 rounded-2xl flex items-center justify-center text-3xl border border-amber-500/30 animate-bounce">👑</div>
            <h3 class="text-sm font-black text-amber-400 uppercase tracking-widest">How to Play Royal Tower</h3>
            <p class="text-xs text-slate-300 font-medium leading-relaxed">
                Bet amount select karein aur <span class="text-amber-400 font-bold">Enter Royal Tower</span> dabayein. Har floor par safe door (<span class="text-emerald-400 font-bold">💎</span>) chun kar upar chadein aur guards (<span class="text-rose-400 font-bold">🛡️</span>) se bachein!
            </p>
            <button onclick="closeTutorial()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 text-slate-950 font-black text-xs uppercase tracking-widest shadow-lg shadow-amber-500/30 transition-all">GOT IT, LET'S CLIMB!</button>
        </div>
    </div>

    <!-- VIP Toast Container -->
    <div id="toastContainer" class="fixed top-5 left-0 right-0 z-[9999] flex justify-center pointer-events-none px-4"></div>

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-[#060913]/95 backdrop-blur-md border-b border-amber-500/20 px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='dashboard.html'" class="w-9 h-9 rounded-xl bg-slate-800/80 flex items-center justify-center font-bold text-white hover:bg-slate-700">←</button>
            <div class="flex items-center gap-2">
               <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-amber-500 to-yellow-600 flex items-center justify-center text-xs shadow-md shadow-amber-500/30">👑</div>
               <div>
                   <h2 class="text-xs font-black text-amber-400 uppercase tracking-wider">VIP Royal Tower</h2>
                   <span class="text-[10px] text-yellow-300 font-semibold">● Palace Ascent & Treasure</span>
               </div>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-slate-900/90 border border-amber-500/30 px-3.5 py-1.5 rounded-full shadow-inner">
            <span class="text-[10px] uppercase font-bold text-slate-400">Bal:</span>
            <span id="userBalance" class="text-xs font-black text-emerald-400">₹0.00</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto w-full p-4 space-y-4">

        <!-- Game Arena -->
        <div class="royal-panel rounded-3xl p-4 text-center relative overflow-hidden shadow-2xl space-y-3">
            
            <div id="gameStatus" class="flex justify-between items-center bg-slate-950/80 py-2.5 px-3 rounded-2xl border border-amber-500/20 text-xs">
                <span class="font-extrabold text-amber-300 uppercase">Multiplier: <strong id="multiplierTxt" class="text-emerald-400">1.00x</strong></span>
                <span class="font-extrabold text-slate-400">Royal Floor: <strong id="levelTxt" class="text-amber-400">0 / 8</strong></span>
            </div>

            <!-- Vertical Royal Tower Container (8 Floors, 3 Doors) -->
            <div id="towerContainer" class="space-y-2 py-2 flex flex-col-reverse">
                <!-- Generated via JS -->
            </div>

        </div>

        <!-- Controls Panel -->
        <div class="royal-panel rounded-3xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-300 uppercase">Wager Amount (₹)</span>
            </div>
            
            <!-- Default Bet ₹10 -->
            <input type="number" id="betAmount" value="10" class="w-full bg-[#060913] border border-amber-500/30 rounded-2xl px-4 py-3 text-xs text-white font-bold focus:outline-none focus:border-amber-500 disabled:opacity-50">

            <!-- Quick Bets Layout (Standard Two-Row Design: 10 to 1000) -->
            <div class="space-y-1.5">
                <div class="grid grid-cols-6 gap-1">
                    <button type="button" onclick="setBet(10)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700/50">10</button>
                    <button type="button" onclick="setBet(20)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700/50">20</button>
                    <button type="button" onclick="setBet(30)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700/50">30</button>
                    <button type="button" onclick="setBet(40)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700/50">40</button>
                    <button type="button" onclick="setBet(50)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700/50">50</button>
                    <button type="button" onclick="setBet(100)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700/50">100</button>
                </div>
                <div class="grid grid-cols-5 gap-1">
                    <button type="button" onclick="setBet(200)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700/50">200</button>
                    <button type="button" onclick="setBet(400)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700/50">400</button>
                    <button type="button" onclick="setBet(600)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700/50">600</button>
                    <button type="button" onclick="setBet(800)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700/50">800</button>
                    <button type="button" onclick="setBet(1000)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-slate-300 border border-slate-700/50">1000</button>
                </div>
            </div>

            <button id="actionBtn" onclick="handleTowerAction()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 text-slate-950 font-black text-xs uppercase tracking-widest shadow-lg shadow-amber-500/30 transition-all">ENTER ROYAL TOWER 🏰</button>
        </div>
    </main>

    <!-- Firebase & Game Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ",
            authDomain: "nexuswin-aa829.firebaseapp.com",
            databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com",
            projectId: "nexuswin-aa829",
            storageBucket: "nexuswin-aa829.firebasestorage.app",
            messagingSenderId: "865579357605",
            appId: "1:865579357605:web:7af15e869ce54756a8844c",
            measurementId: "G-NTZY5VKYP0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let userBalance = 0;
        let gameActive = false;
        let currentBet = 10;
        let currentLevel = 0; 
        let forcedGuardCol = -1;

        const multipliers = [1.25, 1.55, 1.95, 2.45, 3.10, 3.90, 4.90, 6.20];

        window.closeTutorial = function() {
            document.getElementById('tutorial-modal').classList.remove('show');
        }

        function showVipToast(title, message, type = 'info') {
            const container = document.getElementById('toastContainer');
            container.innerHTML = '';
            
            const toast = document.createElement('div');
            let bgGradient = 'linear-gradient(135deg, #0f172aee 0%, #090d16ee 100%)';
            let borderColor = '#f59e0b';
            let icon = '👑';
            let titleColor = 'text-white';

            if(type === 'success') {
                bgGradient = 'linear-gradient(135deg, #064e3b 0%, #022c22 100%)';
                borderColor = '#10b981';
                icon = '🏆';
                titleColor = 'text-emerald-400';
            } else if(type === 'error') {
                bgGradient = 'linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%)';
                borderColor = '#f43f5e';
                icon = '🚨';
                titleColor = 'text-rose-400';
            }

            toast.className = `pointer-events-auto flex items-center gap-4 px-5 py-4 rounded-3xl shadow-2xl backdrop-blur-2xl border-2 vip-toast-enter max-w-sm w-full mx-4`;
            toast.style.background = bgGradient;
            toast.style.borderColor = borderColor;
            toast.style.boxShadow = `0 20px 40px rgba(0,0,0,0.6), 0 0 20px ${borderColor}44`;
            
            toast.innerHTML = `
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-black/30 border border-white/10 shrink-0 shadow-inner">
                    ${icon}
                </div>
                <div class="flex-1">
                    <div class="text-[13px] font-black uppercase tracking-wider ${titleColor}">${title}</div>
                    <div class="text-xs font-semibold text-slate-200 mt-0.5">${message}</div>
                </div>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('vip-toast-enter');
                toast.classList.add('vip-toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                onValue(ref(db, 'users/' + user.uid), (snap) => {
                    if(snap.exists() && snap.val().balance !== undefined) {
                        userBalance = snap.val().balance;
                        document.getElementById('userBalance').innerText = `₹${userBalance.toFixed(2)}`;
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });

        window.setBet = (amt) => { 
            if(gameActive) return;
            currentBet = amt;
            document.getElementById('betAmount').value = amt; 
        }

        function toggleControls(disable) {
            const input = document.getElementById('betAmount');
            input.disabled = disable;
            
            const quickBtns = document.querySelectorAll('.quick-btn');
            quickBtns.forEach(btn => {
                btn.disabled = disable;
            });

            if(disable) {
                input.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                input.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function renderTower() {
            let html = '';
            for(let r = 0; r < 8; r++) {
                html += `<div class="tower-row" id="row-${r}">`;
                for(let c = 0; c < 3; c++) {
                    let tileClass = 'tower-tile disabled';
                    let content = '🚪';
                    if(gameActive && r === currentLevel) {
                        tileClass = 'tower-tile active';
                        content = '🗝️';
                    } else if(r < currentLevel) {
                        tileClass = 'tower-tile revealed-safe';
                        content = '💎';
                    }
                    html += `<button type="button" onclick="clickDoor(${r}, ${c})" id="tile-${r}-${c}" class="${tileClass}" ${(!gameActive || r !== currentLevel) ? 'disabled' : ''}>${content}</button>`;
                }
                html += `</div>`;
            }
            document.getElementById('towerContainer').innerHTML = html;
        }
        renderTower();

        window.handleTowerAction = async function() {
            if(!gameActive) {
                let bet = parseFloat(document.getElementById('betAmount').value);
                if(!bet || bet < 10) {
                    showVipToast("Invalid Wager", "Minimum wager amount is ₹10", "error");
                    return;
                }
                if(bet > userBalance) {
                    showVipToast("Low Balance", "Insufficient wallet balance!", "error");
                    return;
                }

                currentBet = bet;
                userBalance -= currentBet;
                await update(ref(db, `users/${currentUser.uid}`), { balance: userBalance });

                gameActive = true;
                currentLevel = 0;
                toggleControls(true);

                let roll = Math.random();
                let forceEarlyLoss = roll < 0.75;
                forcedGuardCol = forceEarlyLoss ? Math.floor(Math.random() * 3) : -1;

                let actionBtn = document.getElementById('actionBtn');
                actionBtn.innerText = "CLAIM ROYAL WIN (CLIMB 1 FLOOR FIRST)";
                actionBtn.className = "w-full py-3.5 rounded-2xl bg-slate-800 text-slate-500 font-black text-xs uppercase tracking-widest cursor-not-allowed";
                
                renderTower();
                document.getElementById('multiplierTxt').innerText = "1.00x";
                document.getElementById('levelTxt').innerText = `1 / 8`;
            } else {
                if(currentLevel === 0) {
                    showVipToast("Ascent Required", "Climb at least 1 royal floor before claiming cashout!", "error");
                    return;
                }

                let mult = multipliers[currentLevel - 1];
                let payout = currentBet * mult;
                userBalance += payout;
                await update(ref(db, `users/${currentUser.uid}`), { balance: userBalance });

                showVipToast("Royal Cashout!", `Won ₹${payout.toFixed(2)} at ${mult}x`, "success");
                resetGame();
            }
        }

        window.clickDoor = async function(row, col) {
            if(!gameActive || row !== currentLevel) return;

            let tile = document.getElementById(`tile-${row}-${col}`);
            
            if(col === forcedGuardCol || (Math.random() < 0.40 && currentLevel >= 1)) {
                tile.innerHTML = '🛡️';
                tile.className = 'tower-tile revealed-trap';
                gameActive = false;
                showVipToast("Royal Guard Caught You!", `Ascent failed and lost ₹${currentBet.toFixed(2)}`, "error");
                resetGame();
            } else {
                tile.innerHTML = '💎';
                tile.className = 'tower-tile revealed-safe';
                currentLevel++;

                let actionBtn = document.getElementById('actionBtn');
                actionBtn.innerText = "CLAIM ROYAL WIN (CASHOUT)";
                actionBtn.className = "w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 text-slate-950 font-black text-xs uppercase tracking-widest shadow-lg shadow-amber-500/30 transition-all";

                if(currentLevel >= 8) {
                    let payout = currentBet * multipliers[7];
                    userBalance += payout;
                    await update(ref(db, `users/${currentUser.uid}`), { balance: userBalance });
                    showVipToast("Throne Room Reached!", `Epic Victory! Won ₹${payout.toFixed(2)}`, "success");
                    resetGame();
                } else {
                    let mult = multipliers[currentLevel - 1];
                    document.getElementById('multiplierTxt').innerText = `${mult}x`;
                    document.getElementById('levelTxt').innerText = `${currentLevel + 1} / 8`;
                    renderTower();
                }
            }
        }

        function resetGame() {
            gameActive = false;
            currentLevel = 0;
            renderTower();
            toggleControls(false);
            let actionBtn = document.getElementById('actionBtn');
            actionBtn.innerText = "ENTER ROYAL TOWER 🏰";
            actionBtn.className = "w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 text-slate-950 font-black text-xs uppercase tracking-widest shadow-lg shadow-amber-500/30 transition-all";
            document.getElementById('multiplierTxt').innerText = "1.00x";
            document.getElementById('levelTxt').innerText = `0 / 8`;
        }
    </script>
</body>
</html>
