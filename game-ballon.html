<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pump Balloon Pro - NexusWin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #030712; color: #fff; overflow-x: hidden; margin: 0; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* VIP & Modern Large Toast Animations */
        @keyframes vipSlideDown {
            0% { transform: translateY(-120%) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes vipSlideUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120%) scale(0.9); opacity: 0; }
        }
        .vip-toast-enter { animation: vipSlideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .vip-toast-exit { animation: vipSlideUp 0.3s ease-in forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center pb-6">

    <!-- VIP Large Modern Toast Container (Top Center) -->
    <div id="toastContainer" class="fixed top-5 left-0 right-0 z-[9999] flex justify-center pointer-events-none px-4"></div>

    <header class="w-full max-w-md bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <button onclick="window.location.href='dashboard.html'" class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-slate-300 font-bold">←</button>
            <h1 class="text-xs font-black text-rose-400 uppercase tracking-wider">🎈 Pump Balloon Pro</h1>
        </div>
        <div class="bg-slate-950 border border-slate-800 px-3 py-1 rounded-full flex items-center gap-2">
            <span class="text-[10px] text-slate-400 uppercase font-bold">Bal:</span>
            <span id="playerBalance" class="text-xs font-black text-emerald-400">₹0.00</span>
        </div>
    </header>

    <main class="w-full max-w-md p-3 flex flex-col gap-3">

        <div class="glass-panel rounded-[2rem] p-3 relative flex flex-col items-center h-[380px] justify-between border border-rose-500/30 shadow-2xl">
            
            <div class="w-full flex justify-between items-center bg-black/60 px-3 py-2 rounded-2xl border border-slate-800 z-20">
                <div>
                    <span class="text-[9px] text-slate-400 uppercase font-bold block">Multiplier</span>
                    <span id="liveMultiplier" class="text-sm font-black text-rose-400">1.00x</span>
                </div>
                <div class="text-right">
                    <span class="text-[9px] text-slate-400 uppercase font-bold block">Potential Win</span>
                    <span id="potentialWin" class="text-sm font-black text-emerald-400">₹0.00</span>
                </div>
            </div>

            <div class="w-full flex-1 relative my-2 overflow-hidden rounded-2xl flex flex-col items-center justify-center bg-slate-950 border border-slate-800/80">
                
                <div class="absolute w-40 h-40 bg-rose-500/10 rounded-full blur-2xl"></div>

                <div class="flex flex-col items-center z-10 transition-transform duration-200" id="balloonGroup">
                    <div id="balloonVisual" class="text-7xl select-none filter drop-shadow-[0_10px_15px_rgba(244,63,94,0.4)]">
                        🎈
                    </div>
                    <div class="w-1.5 h-12 bg-slate-500 -mt-1"></div>
                    <div class="bg-slate-800 border border-slate-700 px-3 py-1 rounded-xl text-xs font-black text-slate-300 shadow-inner">
                        🗜️ PUMP
                    </div>
                </div>

                <div class="absolute top-3 text-center">
                    <span id="stageInfo" class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Press Push to Pump Balloon</span>
                </div>

            </div>

            <div class="w-full bg-slate-900/90 border border-slate-800 py-1.5 px-3 rounded-xl text-center z-20">
                <span id="statusText" class="text-[11px] font-bold text-slate-300">Start game and push pump carefully!</span>
            </div>

        </div>

        <div class="glass-panel rounded-[2rem] p-4 flex flex-col gap-3">
            
            <!-- Bet Input Box -->
            <input type="number" id="customBet" value="10" class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-white font-bold focus:outline-none focus:border-rose-500 transition-all">

            <!-- Quick Bets -->
            <div class="space-y-1">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Quick Bet (10 - 100)</div>
                <div class="grid grid-cols-6 gap-1">
                    <button onclick="setBet(10)" class="quick-btn py-1 bg-slate-800 hover:bg-slate-700 rounded-xl text-[10px] font-bold text-slate-300 border border-slate-700/50">10</button>
                    <button onclick="setBet(20)" class="quick-btn py-1 bg-slate-800 hover:bg-slate-700 rounded-xl text-[10px] font-bold text-slate-300 border border-slate-700/50">20</button>
                    <button onclick="setBet(30)" class="quick-btn py-1 bg-slate-800 hover:bg-slate-700 rounded-xl text-[10px] font-bold text-slate-300 border border-slate-700/50">30</button>
                    <button onclick="setBet(40)" class="quick-btn py-1 bg-slate-800 hover:bg-slate-700 rounded-xl text-[10px] font-bold text-slate-300 border border-slate-700/50">40</button>
                    <button onclick="setBet(50)" class="quick-btn py-1 bg-slate-800 hover:bg-slate-700 rounded-xl text-[10px] font-bold text-slate-300 border border-slate-700/50">50</button>
                    <button onclick="setBet(100)" class="quick-btn py-1 bg-slate-800 hover:bg-slate-700 rounded-xl text-[10px] font-bold text-slate-300 border border-slate-700/50">100</button>
                </div>

                <div class="text-[10px] font-bold text-slate-400 uppercase pt-0.5">High Stakes (300 - 1000)</div>
                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="setBet(300)" class="quick-btn py-1 bg-slate-800 hover:bg-slate-700 rounded-xl text-[10px] font-bold text-amber-400 border border-slate-700/50">300</button>
                    <button onclick="setBet(500)" class="quick-btn py-1 bg-slate-800 hover:bg-slate-700 rounded-xl text-[10px] font-bold text-amber-400 border border-slate-700/50">500</button>
                    <button onclick="setBet(700)" class="quick-btn py-1 bg-slate-800 hover:bg-slate-700 rounded-xl text-[10px] font-bold text-amber-400 border border-slate-700/50">700</button>
                    <button onclick="setBet(1000)" class="quick-btn py-1 bg-slate-800 hover:bg-slate-700 rounded-xl text-[10px] font-bold text-amber-400 border border-slate-700/50">1000</button>
                </div>
            </div>

            <div class="flex gap-2 pt-1">
                <button id="actionBtn" onclick="handlePumpAction()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 text-black font-black text-xs uppercase tracking-widest shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                    START GAME 🎈
                </button>
            </div>

            <button id="collectBtn" onclick="cashOut()" class="w-full py-2.5 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 text-black font-black text-xs uppercase tracking-widest hidden shadow-lg shadow-amber-500/20 active:scale-95 transition-all">
                COLLECT PROFIT 💰
            </button>
        </div>

    </main>

    <!-- Firebase & Game Engine Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ", authDomain: "nexuswin-aa829.firebaseapp.com", databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com", projectId: "nexuswin-aa829", storageBucket: "nexuswin-aa829.firebasestorage.app", messagingSenderId: "865579357605", appId: "1:865579357605:web:7af15e869ce54756a8844c" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let balance = 0.00;
        let currentBet = 10;
        let gameActive = false;
        let multiplier = 1.00;
        let pushCount = 0;
        let scaleSize = 1;
        let burstAtPush = 0;

        // VIP Modern Large Screen Toast Function
        function showVipToast(title, message, type = 'info') {
            const container = document.getElementById('toastContainer');
            container.innerHTML = ''; 
            
            const toast = document.createElement('div');
            
            let bgGradient = 'linear-gradient(135deg, #0f172aee 0%, #090d16ee 100%)';
            let borderColor = '#334155';
            let icon = '🎈';
            let titleColor = 'text-white';

            if(type === 'success') {
                bgGradient = 'linear-gradient(135deg, #064e3b 0%, #022c22 100%)';
                borderColor = '#10b981';
                icon = '🏆';
                titleColor = 'text-emerald-400';
            } else if(type === 'error') {
                bgGradient = 'linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%)';
                borderColor = '#f43f5e';
                icon = '🚨';
                titleColor = 'text-rose-400';
            }

            toast.className = `pointer-events-auto flex items-center gap-4 px-5 py-4 rounded-3xl shadow-2xl backdrop-blur-2xl border-2 vip-toast-enter max-w-sm w-full mx-4`;
            toast.style.background = bgGradient;
            toast.style.borderColor = borderColor;
            toast.style.boxShadow = `0 20px 40px rgba(0,0,0,0.6), 0 0 20px ${borderColor}44`;
            
            toast.innerHTML = `
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-black/30 border border-white/10 shrink-0 shadow-inner">
                    ${icon}
                </div>
                <div class="flex-1">
                    <div class="text-[13px] font-black uppercase tracking-wider ${titleColor}">${title}</div>
                    <div class="text-xs font-semibold text-slate-200 mt-0.5">${message}</div>
                </div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('vip-toast-enter');
                toast.classList.add('vip-toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                onValue(ref(db, 'users/' + user.uid), (snap) => {
                    if(snap.exists() && snap.val().balance !== undefined) {
                        balance = snap.val().balance;
                        updateUI();
                    }
                });
            } else { window.location.href = "index.html"; }
        });

        window.setBet = (val) => {
            if (gameActive) return;
            currentBet = val;
            document.getElementById('customBet').value = val;
        }

        function updateUI() {
            document.getElementById('playerBalance').innerText = `₹${balance.toFixed(2)}`;
        }

        function toggleControls(disable) {
            const input = document.getElementById('customBet');
            input.disabled = disable;
            
            const quickBtns = document.querySelectorAll('.quick-btn');
            quickBtns.forEach(btn => {
                btn.disabled = disable;
                if(disable) {
                    btn.classList.add('opacity-40', 'cursor-not-allowed');
                } else {
                    btn.classList.remove('opacity-40', 'cursor-not-allowed');
                }
            });

            if(disable) {
                input.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                input.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        window.handlePumpAction = async function() {
            let betVal = parseFloat(document.getElementById('customBet').value);
            
            if (!gameActive) {
                if (!betVal || betVal < 10) {
                    showVipToast("Invalid Bet", "Minimum bet amount is ₹10", "error");
                    return;
                }
                if (betVal > balance) {
                    showVipToast("Low Balance", "Insufficient wallet balance to place bet!", "error");
                    return;
                }
                currentBet = betVal;
                balance -= currentBet;
                await update(ref(db, `users/${currentUser.uid}`), { balance: balance });
                updateUI();

                gameActive = true;
                toggleControls(true);

                multiplier = 1.00;
                pushCount = 0;
                scaleSize = 1;

                let rand = Math.random();
                if (rand < 0.70) {
                    burstAtPush = Math.floor(Math.random() * 3) + 1; 
                } else if (rand < 0.95) {
                    burstAtPush = Math.floor(Math.random() * 4) + 4; 
                } else {
                    burstAtPush = Math.floor(Math.random() * 5) + 8; 
                }

                document.getElementById('balloonVisual').innerText = "🎈";
                document.getElementById('balloonVisual').style.transform = "scale(1)";
                
                let btn = document.getElementById('actionBtn');
                btn.innerText = "PUSH PUMP 💨";
                btn.className = "w-full py-3 rounded-2xl bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-400 text-white font-black text-xs uppercase tracking-widest shadow-lg shadow-rose-500/20 active:scale-95 transition-all";
                
                document.getElementById('collectBtn').classList.remove('hidden');
                document.getElementById('statusText').innerText = "Game started! Tap Push Pump to inflate balloon.";
                document.getElementById('stageInfo').innerText = "PUMP READY";
                
                updateDisplayValues();
                return;
            }

            pushCount++;

            if (pushCount >= burstAtPush) {
                burstBalloon();
                return;
            }

            multiplier = parseFloat((1.00 + (pushCount * 0.1)).toFixed(1));
            scaleSize += 0.08;
            if(scaleSize > 1.7) scaleSize = 1.7;

            document.getElementById('balloonVisual').style.transform = `scale(${scaleSize})`;
            updateDisplayValues();
            document.getElementById('statusText').innerText = `Pumped successfully! Multiplier is now ${multiplier}x`;
        }

        function updateDisplayValues() {
            document.getElementById('liveMultiplier').innerText = `${multiplier.toFixed(1)}x`;
            let potential = currentBet * multiplier;
            document.getElementById('potentialWin').innerText = `₹${potential.toFixed(2)}`;
        }

        window.cashOut = async function() {
            if (!gameActive) return;

            let winAmount = currentBet * multiplier;
            balance += winAmount;
            await update(ref(db, `users/${currentUser.uid}`), { balance: balance });
            updateUI();

            showVipToast("Big Win!", `Successfully collected ₹${winAmount.toFixed(2)} at ${multiplier.toFixed(1)}x`, "success");

            document.getElementById('balloonVisual').innerText = "🎉";
            document.getElementById('statusText').innerText = `🎉 Successfully Collected! Won ₹${winAmount.toFixed(2)}`;
            document.getElementById('stageInfo').innerText = "COLLECTED!";

            endGameCleanup();
        }

        function burstBalloon() {
            gameActive = false;
            showVipToast("Balloon Burst!", `Balloon popped at ${multiplier.toFixed(1)}x. Bet lost!`, "error");

            document.getElementById('balloonVisual').innerText = "💥";
            document.getElementById('statusText').innerText = `💥 BURST! Balloon popped at ${multiplier.toFixed(1)}x. Bet Lost! ❌`;
            document.getElementById('stageInfo').innerText = "POP!";

            setTimeout(() => {
                document.getElementById('balloonVisual').innerText = "🎈";
            }, 1500);

            endGameCleanup();
        }

        function endGameCleanup() {
            gameActive = false;
            toggleControls(false);

            let btn = document.getElementById('actionBtn');
            btn.innerText = "START GAME 🎈";
            btn.className = "w-full py-3 rounded-2xl bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 text-black font-black text-xs uppercase tracking-widest shadow-lg shadow-emerald-500/20 active:scale-95 transition-all";
            document.getElementById('collectBtn').classList.add('hidden');
        }
    </script>
</body>
</html>
