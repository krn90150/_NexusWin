<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - User Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel {
            background: rgba(13, 17, 28, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen p-4 pb-24 flex flex-col justify-between">

    <div class="max-w-md mx-auto w-full space-y-6">
        <!-- Top Navigation Bar -->
        <header class="glass-panel rounded-2xl px-4 py-3.5 flex items-center justify-between border border-slate-800">
            <button onclick="window.location.href='dashboard.html'" class="text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1">← Back to Lobby</button>
            <h1 class="text-xs font-black text-white uppercase tracking-wider">Account Profile</h1>
        </header>

        <!-- Profile Card -->
        <div class="glass-panel rounded-3xl p-6 border border-slate-800 text-center relative overflow-hidden">
            <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-indigo-600 to-violet-500 mx-auto flex items-center justify-center font-black text-3xl text-white shadow-xl shadow-indigo-600/30 border border-white/10 mb-4">👤</div>
            <h2 id="profilePhone" class="text-sm font-black text-white tracking-wide">Loading...</h2>
            <p class="text-[10px] text-emerald-400 font-semibold uppercase tracking-wider mt-1">Verified Player Account</p>

            <div class="mt-6 pt-6 border-t border-slate-800/80 grid grid-cols-2 gap-4 text-center">
                <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
                    <span class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Wallet Balance</span>
                    <span id="profileBalance" class="text-xs font-black text-emerald-400">₹0.00</span>
                </div>
                <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
                    <span class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Account Status</span>
                    <span class="text-xs font-black text-indigo-400">Active</span>
                </div>
            </div>
        </div>

        <!-- Quick Links Menu -->
        <div class="glass-panel rounded-3xl p-3 border border-slate-800 space-y-2">
            <button onclick="window.location.href='history.html'" class="w-full p-3.5 rounded-2xl bg-slate-900/60 hover:bg-slate-900 flex items-center justify-between text-xs font-bold text-slate-200 transition-all border border-slate-800/60">
                <span class="flex items-center gap-2">📜 Transaction Ledger</span>
                <span>→</span>
            </button>
            <button onclick="window.location.href='dashboard.html'" class="w-full p-3.5 rounded-2xl bg-slate-900/60 hover:bg-slate-900 flex items-center justify-between text-xs font-bold text-slate-200 transition-all border border-slate-800/60">
                <span class="flex items-center gap-2">🎮 Gaming Lobby</span>
                <span>→</span>
            </button>
        </div>

        <!-- Logout Button -->
        <button onclick="logoutUser()" class="w-full py-4 rounded-2xl bg-rose-600/10 hover:bg-rose-600/20 border border-rose-500/20 text-rose-400 font-extrabold text-xs uppercase tracking-wider transition-all shadow-lg">
            Logout Account
        </button>
    </div>

    <!-- Firebase Profile Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ",
            authDomain: "nexuswin-aa829.firebaseapp.com",
            databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com",
            projectId: "nexuswin-aa829",
            storageBucket: "nexuswin-aa829.firebasestorage.app",
            messagingSenderId: "865579357605",
            appId: "1:865579357605:web:7af15e869ce54756a8844c",
            measurementId: "G-NTZY5VKYP0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('profilePhone').innerText = user.phoneNumber || "Gamer";
                
                const userRef = ref(db, 'users/' + user.uid);
                onValue(userRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.balance !== undefined) {
                        document.getElementById('profileBalance').innerText = `₹${data.balance.toFixed(2)}`;
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });

        window.logoutUser = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                alert("Error signing out.");
            });
        }
    </script>
    <!DOCTYPE html>

</html>
