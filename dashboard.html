        window.renderCategoryRows = function() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            const categoriesMap = {};
            gamesList.forEach(game => {
                if (!categoriesMap[game.catKey]) {
                    categoriesMap[game.catKey] = {
                        title: game.catTitle,
                        games: []
                    };
                }
                categoriesMap[game.catKey].games.push(game);
            });

            for (const key in categoriesMap) {
                const catData = categoriesMap[key];
                
                let gamesHtml = '';
                catData.games.forEach(game => {
                    gamesHtml += `
                        <div onclick="launchGame('${game.file}')" class="game-card-horizontal glass-panel rounded-3xl p-2.5 flex flex-col gap-2 hover:border-rose-500/50 cursor-pointer transition-all group">
                            <div class="h-28 rounded-2xl bg-gradient-to-br ${game.iconBg} flex flex-col items-center justify-center relative overflow-hidden shadow-inner border border-white/10 group-hover:scale-[1.02] transition-transform duration-300">
                                <div class="absolute inset-0 bg-black/15"></div>
                                <div class="z-10 group-hover:scale-110 transition-transform duration-300">
                                    ${game.svgLogo}
                                </div>
                                <div class="absolute bottom-1.5 right-1.5 bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-full border border-white/10 z-10">
                                    <span class="text-[8px] font-extrabold text-white">PLAY</span>
                                </div>
                            </div>
                            <div class="px-1">
                                <h4 class="text-[11px] font-bold text-white truncate">${game.name}</h4>
                                <p class="text-[9px] text-slate-400 font-medium truncate">${game.desc}</p>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="space-y-2.5">
                        <div class="flex items-center justify-between px-1">
                            <h3 class="text-xs font-extrabold text-slate-200 uppercase tracking-widest">${catData.title}</h3>
                            <span class="text-[10px] text-rose-400 font-bold">Swipe →</span>
                        </div>
                        <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-none">
                            ${gamesHtml}
                        </div>
                    </div>
                `;
            }
        }

        window.launchGame = function(fileName) {
            window.location.href = fileName;
        }

        renderCategoryRows();

        window.submitDepositRequest = async function() {
            try {
                const user = auth.currentUser;
                if (!user) {
                    alert("❌ Session expired! Please login again.");
                    window.location.href = "index.html";
                    return;
                }

                const amountInput = document.getElementById('depositAmount').value;
                const utrInput = document.getElementById('depositUtr').value;

                const amount = parseFloat(amountInput);
                const utr = utrInput ? utrInput.trim() : "";

                if (!amount || !utr) {
                    alert("Please enter both deposit amount and UTR ID.");
                    return;
                }

                if (amount < 100) {
                    alert("❌ Minimum deposit limit is ₹100!");
                    return;
                }

                if (utr.length < 6) {
                    alert("Please enter a valid UTR transaction ID.");
                    return;
                }

                const depositsRef = ref(db, 'transactions/deposits');
                const utrQuery = query(depositsRef, orderByChild('utr'), equalTo(utr));
                const snapshot = await get(utrQuery);

                if (snapshot.exists()) {
                    alert("❌ This UTR number has already been submitted!");
                    return;
                }

                const newReq = push(depositsRef);
                await set(newReq, {
                    uid: user.uid,
                    email: user.email || "User",
                    amount: amount,
                    utr: utr,
                    status: 'Pending',
                    timestamp: Date.now()
                });

                alert("✅ Deposit request submitted successfully!");
                closeDepositModal();
                document.getElementById('depositAmount').value = '';
                document.getElementById('depositUtr').value = '';
                
            } catch (error) {
                console.error("Deposit Error:", error);
                alert("❌ Error: " + error.message);
            }
        }

        window.submitWithdrawRequest = async function() {
            try {
                const user = auth.currentUser;
                if (!user) {
                    alert("❌ Session expired! Please login again.");
                    window.location.href = "index.html";
                    return;
                }

                const amountInput = document.getElementById('withdrawAmount').value;
                const upiInput = document.getElementById('withdrawUpi').value;

                const amount = parseFloat(amountInput);
                const upi = upiInput ? upiInput.trim() : "";

                if (!amount || !upi || !upi.includes('@')) {
                    alert("Please enter a valid withdrawal amount and correct UPI ID.");
                    return;
                }

                if (amount < 100) {
                    alert("❌ Minimum withdrawal limit is ₹100!");
                    return;
                }

                if (amount > currentUserBalance) {
                    alert(`❌ Insufficient balance! Your wallet balance is ₹${currentUserBalance}.`);
                    return;
                }

                const newBalance = currentUserBalance - amount;

                const updates = {};
                updates[`users/${user.uid}/balance`] = newBalance;
                
                const newReqRef = push(ref(db, 'transactions/withdrawals'));
                updates[`transactions/withdrawals/${newReqRef.key}`] = {
                    uid: user.uid,
                    email: currentUserEmail,
                    amount: amount,
                    upi: upi,
                    status: 'Pending',
                    timestamp: Date.now()
                };

                await update(ref(db), updates);

                alert("✅ Withdrawal request submitted & amount deducted instantly!");
                closeWithdrawModal();
                document.getElementById('withdrawAmount').value = '';
                document.getElementById('withdrawUpi').value = '';

            } catch (error) {
                console.error("Withdraw Error:", error);
                alert("❌ Error: " + error.message);
            }
        }
    </script>
