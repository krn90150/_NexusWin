<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - 99 Club Color Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #05070a; color: #fff; }
        .glass-panel { background: linear-gradient(135deg, #0f172a 0%, #090d16 100%); border: 1px solid rgba(255, 255, 255, 0.08); }
        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        /* VIP & Modern Large Toast Animations */
        @keyframes vipSlideDown {
            0% { transform: translateY(-120%) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes vipSlideUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120%) scale(0.9); opacity: 0; }
        }
        .vip-toast-enter { animation: vipSlideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .vip-toast-exit { animation: vipSlideUp 0.3s ease-in forwards; }
    </style>
</head>
<body class="min-h-screen pb-28">

    <!-- VIP Large Modern Toast Container (Top Center) -->
    <div id="toastContainer" class="fixed top-5 left-0 right-0 z-[9999] flex justify-center pointer-events-none px-4"></div>

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-[#090d16]/95 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='dashboard.html'" class="w-9 h-9 rounded-xl bg-slate-800/80 flex items-center justify-center font-bold text-white hover:bg-slate-700">←</button>
            <div>
               <h2 class="text-xs font-black text-amber-400 uppercase tracking-wider">🎨 99 Club Color Prediction</h2>
               <span class="text-[10px] text-emerald-400 font-semibold">● 15s VIP Fast Round</span>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-800 px-3.5 py-1.5 rounded-full shadow-inner">
            <span class="text-[10px] uppercase font-bold text-slate-400">Bal:</span>
            <span id="userBalance" class="text-xs font-black text-emerald-400">₹0.00</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Game Arena & Timer Card -->
        <div class="glass-panel rounded-3xl p-4 relative overflow-hidden shadow-2xl space-y-4">
            
            <div class="flex justify-between items-center bg-slate-950/80 py-2.5 px-4 rounded-2xl border border-slate-800">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-400 block">Period ID</span>
                    <span id="periodId" class="text-xs font-black text-amber-400">2026090901</span>
                </div>
                <div class="text-right">
                    <span class="text-[10px] uppercase font-bold text-slate-400 block">Time Remaining</span>
                    <span id="timerTxt" class="text-sm font-black text-rose-500 animate-pulse">00:15</span>
                </div>
            </div>

            <!-- Result Display Arena -->
            <div id="gameStatus" class="text-center py-4 bg-slate-900/50 rounded-2xl border border-slate-800/80 space-y-1">
                <span class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Status</span>
                <h3 id="statusText" class="text-sm font-black text-amber-300 uppercase">Place Your Bets Now!</h3>
            </div>

            <!-- Color Betting Buttons -->
            <div class="grid grid-cols-3 gap-2 pt-2">
                <button onclick="selectColor('green')" id="btn-green" class="color-btn py-3.5 rounded-2xl bg-emerald-600/90 hover:bg-emerald-500 font-black text-xs uppercase tracking-wider border border-emerald-400/40 shadow-lg flex flex-col items-center gap-1 transition-all">
                    <span>Green</span>
                    <span class="text-[9px] text-emerald-200">2x</span>
                </button>
                <button onclick="selectColor('violet')" id="btn-violet" class="color-btn py-3.5 rounded-2xl bg-purple-600/90 hover:bg-purple-500 font-black text-xs uppercase tracking-wider border border-purple-400/40 shadow-lg flex flex-col items-center gap-1 transition-all">
                    <span>Violet</span>
                    <span class="text-[9px] text-purple-200">4.5x</span>
                </button>
                <button onclick="selectColor('red')" id="btn-red" class="color-btn py-3.5 rounded-2xl bg-rose-600/90 hover:bg-rose-500 font-black text-xs uppercase tracking-wider border border-rose-400/40 shadow-lg flex flex-col items-center gap-1 transition-all">
                    <span>Red</span>
                    <span class="text-[9px] text-rose-200">2x</span>
                </button>
            </div>
        </div>

        <!-- Betting Controls Panel -->
        <div class="glass-panel rounded-3xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-300 uppercase">Bet Amount (₹)</span>
            </div>

            <input type="number" id="betAmount" value="10" class="w-full bg-[#05070a] border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white font-bold focus:outline-none focus:border-amber-500 transition-all">

            <!-- Quick Bets -->
            <div class="space-y-1.5">
                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="setBet(10)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50">10</button>
                    <button onclick="setBet(20)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50">20</button>
                    <button onclick="setBet(50)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50">50</button>
                    <button onclick="setBet(100)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50">100</button>
                </div>

                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="setBet(300)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50">300</button>
                    <button onclick="setBet(500)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50">500</button>
                    <button onclick="setBet(700)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50">700</button>
                    <button onclick="setBet(1000)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50">1000</button>
                </div>
            </div>

            <button id="betBtn" onclick="placeBet()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-black text-xs uppercase tracking-widest shadow-lg shadow-amber-500/30 transition-all">CONFIRM BET (RED)</button>
        </div>
    </main>

    <!-- Firebase & Game Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ",
            authDomain: "nexuswin-aa829.firebaseapp.com",
            databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com",
            projectId: "nexuswin-aa829",
            storageBucket: "nexuswin-aa829.firebasestorage.app",
            messagingSenderId: "865579357605",
            appId: "1:865579357605:web:7af15e869ce54756a8844c",
            measurementId: "G-NTZY5VKYP0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let userBalance = 0;
        let selectedColor = 'red';
        let currentBetPlaced = null;
        let timeLeft = 15;
        let isRoundLocked = false;

        // VIP Modern Large Screen Toast Function
        function showVipToast(title, message, type = 'info') {
            const container = document.getElementById('toastContainer');
            container.innerHTML = ''; 
            
            const toast = document.createElement('div');
            
            let bgGradient = 'linear-gradient(135deg, #0f172aee 0%, #090d16ee 100%)';
            let borderColor = '#334155';
            let icon = '🎨';
            let titleColor = 'text-white';

            if(type === 'success') {
                bgGradient = 'linear-gradient(135deg, #064e3b 0%, #022c22 100%)';
                borderColor = '#10b981';
                icon = '🏆';
                titleColor = 'text-emerald-400';
            } else if(type === 'error') {
                bgGradient = 'linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%)';
                borderColor = '#f43f5e';
                icon = '🚨';
                titleColor = 'text-rose-400';
            }

            toast.className = `pointer-events-auto flex items-center gap-4 px-5 py-4 rounded-3xl shadow-2xl backdrop-blur-2xl border-2 vip-toast-enter max-w-sm w-full mx-4`;
            toast.style.background = bgGradient;
            toast.style.borderColor = borderColor;
            toast.style.boxShadow = `0 20px 40px rgba(0,0,0,0.6), 0 0 20px ${borderColor}44`;
            
            toast.innerHTML = `
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-black/30 border border-white/10 shrink-0 shadow-inner">
                    ${icon}
                </div>
                <div class="flex-1">
                    <div class="text-[13px] font-black uppercase tracking-wider ${titleColor}">${title}</div>
                    <div class="text-xs font-semibold text-slate-200 mt-0.5">${message}</div>
                </div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('vip-toast-enter');
                toast.classList.add('vip-toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                onValue(ref(db, 'users/' + user.uid), (snap) => {
                    if(snap.exists() && snap.val().balance !== undefined) {
                        userBalance = snap.val().balance;
                        document.getElementById('userBalance').innerText = `₹${userBalance.toFixed(2)}`;
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });

        window.setBet = (amt) => { 
            if(!isRoundLocked) {
                document.getElementById('betAmount').value = amt; 
            }
        }

        window.selectColor = (color) => {
            if(isRoundLocked) return;
            selectedColor = color;
            ['green', 'violet', 'red'].forEach(c => {
                document.getElementById(`btn-${c}`).classList.remove('ring-4', 'ring-amber-400', 'scale-105');
            });
            document.getElementById(`btn-${color}`).classList.add('ring-4', 'ring-amber-400', 'scale-105');
            document.getElementById('betBtn').innerText = `CONFIRM BET (${color.toUpperCase()})`;
        }
        selectColor('red');

        window.placeBet = async function() {
            if(isRoundLocked) return;
            let bet = parseFloat(document.getElementById('betAmount').value);
            
            if(!bet || bet < 10) { 
                showVipToast("Invalid Bet", "Minimum bet amount is ₹10", "error"); 
                return; 
            }
            if(bet > userBalance) { 
                showVipToast("Low Balance", "Insufficient wallet balance to place bet!", "error"); 
                return; 
            }
            if(timeLeft <= 3) { 
                showVipToast("Round Locking", "Please wait for the next round!", "error"); 
                return; 
            }

            userBalance -= bet;
            await update(ref(db, `users/${currentUser.uid}`), { balance: userBalance });

            currentBetPlaced = { amount: bet, color: selectedColor };
            showVipToast("Bet Placed", `Successfully placed ₹${bet} on ${selectedColor.toUpperCase()}`, "success");
            document.getElementById('statusText').innerText = `Bet Placed: ₹${bet} on ${selectedColor.toUpperCase()}`;
            
            const betBtn = document.getElementById('betBtn');
            betBtn.disabled = true;
            betBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        // 15-Second Timer Loop
        setInterval(async () => {
            timeLeft--;
            
            if(timeLeft <= 3) {
                isRoundLocked = true;
            }

            if(timeLeft < 0) {
                timeLeft = 15;
                isRoundLocked = false;

                if(currentBetPlaced && currentUser) {
                    let userWins = Math.random() < 0.30;
                    let winningColor = userWins ? currentBetPlaced.color : (currentBetPlaced.color === 'red' ? 'green' : 'red');

                    if(userWins) {
                        let multiplier = winningColor === 'violet' ? 4.5 : 2;
                        let winAmt = currentBetPlaced.amount * multiplier;
                        userBalance += winAmt;
                        await update(ref(db, `users/${currentUser.uid}`), { balance: userBalance });
                        showVipToast("Big Win!", `Won ₹${winAmt.toFixed(2)}! Color: ${winningColor.toUpperCase()}`, "success");
                        document.getElementById('statusText').innerHTML = `<span class="text-emerald-400">🎉 WON! Color: ${winningColor.toUpperCase()} | ₹${winAmt.toFixed(2)}</span>`;
                    } else {
                        showVipToast("Round Lost", `Color landed on ${winningColor.toUpperCase()}. Try again!`, "error");
                        document.getElementById('statusText').innerHTML = `<span class="text-rose-400">💥 LOSS! Color landed on ${winningColor.toUpperCase()}</span>`;
                    }
                    currentBetPlaced = null;
                } else {
                    document.getElementById('statusText').innerText = "Round Completed! Place bet for next round.";
                }

                const betBtn = document.getElementById('betBtn');
                betBtn.disabled = false;
                betBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            let formattedTime = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
            document.getElementById('timerTxt').innerText = formattedTime;
        }, 1000);
    </script>
</body>
</html>
