<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - Coin Flip Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0b0e14; color: #fff; }
        .glass-panel { background: #141822; border: 1px solid rgba(255, 255, 255, 0.08); }
        .coin { width: 100px; height: 100px; position: relative; transform-style: preserve-3d; transition: transform 1s ease-in-out; margin: 0 auto; }
        .coin-face { position: absolute; width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; backface-visibility: hidden; border: 4px solid #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
        .coin-heads { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #111827; }
        .coin-tails { background: linear-gradient(135deg, #94a3b8 0%, #475569 100%); color: #fff; transform: rotateY(180deg); }

        /* VIP & Modern Large Toast Animations */
        @keyframes vipSlideDown {
            0% { transform: translateY(-120%) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes vipSlideUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120%) scale(0.9); opacity: 0; }
        }
        .vip-toast-enter { animation: vipSlideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .vip-toast-exit { animation: vipSlideUp 0.3s ease-in forwards; }
    </style>
</head>
<body class="min-h-screen pb-28">

    <!-- VIP Large Modern Toast Container (Top Center) -->
    <div id="toastContainer" class="fixed top-5 left-0 right-0 z-[9999] flex justify-center pointer-events-none px-4"></div>

    <header class="sticky top-0 z-50 bg-[#12151c]/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='dashboard.html'" class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center font-bold text-white hover:bg-slate-700">←</button>
            <div>
                <h2 class="text-xs font-black text-amber-500 uppercase tracking-wider">🪙 Coin Flip Pro</h2>
                <span class="text-[10px] text-emerald-400 font-semibold">● Admin Secured Mode</span>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-full shadow-inner">
            <span class="text-[10px] uppercase font-bold text-slate-400">Bal:</span>
            <span id="userBalance" class="text-xs font-black text-emerald-400">₹0.00</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="glass-panel rounded-2xl p-3 grid grid-cols-2 gap-2 text-center">
            <div>
                <span class="text-[9px] text-slate-400 font-bold uppercase block">Multiplier</span>
                <span class="text-base font-black text-amber-400">1.85x</span>
            </div>
            <div>
                <span class="text-[9px] text-slate-400 font-bold uppercase block">Win Chance</span>
                <span class="text-base font-black text-emerald-400">40%</span>
            </div>
        </div>

        <div class="glass-panel rounded-3xl p-8 text-center relative overflow-hidden bg-gradient-to-b from-slate-900 to-[#0d151f]">
            <span class="text-[10px] uppercase font-bold text-slate-500 tracking-widest block mb-6">Flip Result</span>
            <div id="coinContainer" class="coin mb-4">
                <div class="coin-face coin-heads">H</div>
                <div class="coin-face coin-tails">T</div>
            </div>
            <div id="resultText" class="text-xs font-extrabold text-slate-300 uppercase tracking-wider mt-4">Choose Heads or Tails and flip!</div>
        </div>

        <div class="glass-panel rounded-3xl p-4 space-y-3">
            <span class="text-xs font-bold text-slate-300 uppercase block">Select Side</span>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="setChoice('HEADS')" id="btnHeads" class="side-btn py-3 rounded-2xl bg-amber-500 text-slate-950 font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-amber-500/20 transition-all">Heads (H)</button>
                <button onclick="setChoice('TAILS')" id="btnTails" class="side-btn py-3 rounded-2xl bg-slate-800 text-slate-400 font-extrabold text-xs uppercase tracking-wider transition-all">Tails (T)</button>
            </div>
        </div>

        <div class="glass-panel rounded-3xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-300 uppercase">Bet Amount (₹)</span>
            </div>
            
            <input type="number" id="betAmount" value="10" class="w-full bg-[#0b0e14] border border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-white font-semibold focus:outline-none focus:border-amber-500 transition-all">

            <!-- Quick Bets -->
            <div class="space-y-1.5">
                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="setBet(10)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50">10</button>
                    <button onclick="setBet(20)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50">20</button>
                    <button onclick="setBet(50)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50">50</button>
                    <button onclick="setBet(100)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50">100</button>
                </div>

                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="setBet(300)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50">300</button>
                    <button onclick="setBet(500)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50">500</button>
                    <button onclick="setBet(700)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50">700</button>
                    <button onclick="setBet(1000)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50">1000</button>
                </div>
            </div>

            <div class="pt-1">
                <button id="flipBtn" onclick="flipCoin()" class="w-full py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs uppercase tracking-widest shadow-lg shadow-amber-500/20 transition-all">FLIP COIN</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ", authDomain: "nexuswin-aa829.firebaseapp.com", databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com", projectId: "nexuswin-aa829", storageBucket: "nexuswin-aa829.firebasestorage.app", messagingSenderId: "865579357605", appId: "1:865579357605:web:7af15e869ce54756a8844c" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null, userBalance = 0, selectedChoice = 'HEADS', isFlipping = false;

        // VIP Modern Large Screen Toast Function
        function showVipToast(title, message, type = 'info') {
            const container = document.getElementById('toastContainer');
            container.innerHTML = ''; 
            
            const toast = document.createElement('div');
            
            let bgGradient = 'linear-gradient(135deg, #0f172aee 0%, #090d16ee 100%)';
            let borderColor = '#334155';
            let icon = '🪙';
            let titleColor = 'text-white';

            if(type === 'success') {
                bgGradient = 'linear-gradient(135deg, #064e3b 0%, #022c22 100%)';
                borderColor = '#10b981';
                icon = '🏆';
                titleColor = 'text-emerald-400';
            } else if(type === 'error') {
                bgGradient = 'linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%)';
                borderColor = '#f43f5e';
                icon = '🚨';
                titleColor = 'text-rose-400';
            }

            toast.className = `pointer-events-auto flex items-center gap-4 px-5 py-4 rounded-3xl shadow-2xl backdrop-blur-2xl border-2 vip-toast-enter max-w-sm w-full mx-4`;
            toast.style.background = bgGradient;
            toast.style.borderColor = borderColor;
            toast.style.boxShadow = `0 20px 40px rgba(0,0,0,0.6), 0 0 20px ${borderColor}44`;
            
            toast.innerHTML = `
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-black/30 border border-white/10 shrink-0 shadow-inner">
                    ${icon}
                </div>
                <div class="flex-1">
                    <div class="text-[13px] font-black uppercase tracking-wider ${titleColor}">${title}</div>
                    <div class="text-xs font-semibold text-slate-200 mt-0.5">${message}</div>
                </div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('vip-toast-enter');
                toast.classList.add('vip-toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                onValue(ref(db, 'users/' + user.uid), (snap) => {
                    if(snap.exists() && snap.val().balance !== undefined) {
                        userBalance = snap.val().balance;
                        document.getElementById('userBalance').innerText = `₹${userBalance.toFixed(2)}`;
                    }
                });
            } else { window.location.href = "index.html"; }
        });

        window.setBet = (amt) => { 
            if(!isFlipping) {
                document.getElementById('betAmount').value = amt; 
            }
        }

        window.setChoice = (choice) => {
            if(isFlipping) return;
            selectedChoice = choice;
            document.getElementById('btnHeads').className = choice === 'HEADS' ? "side-btn py-3 rounded-2xl bg-amber-500 text-slate-950 font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-amber-500/20 transition-all" : "side-btn py-3 rounded-2xl bg-slate-800 text-slate-400 font-extrabold text-xs uppercase tracking-wider transition-all";
            document.getElementById('btnTails').className = choice === 'TAILS' ? "side-btn py-3 rounded-2xl bg-amber-500 text-slate-950 font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-amber-500/20 transition-all" : "side-btn py-3 rounded-2xl bg-slate-800 text-slate-400 font-extrabold text-xs uppercase tracking-wider transition-all";
        }

        function toggleControls(disable) {
            isFlipping = disable;
            const input = document.getElementById('betAmount');
            input.disabled = disable;

            const allBtns = document.querySelectorAll('.quick-btn, .side-btn, #flipBtn');
            allBtns.forEach(btn => {
                btn.disabled = disable;
                if(disable) {
                    btn.classList.add('opacity-40', 'cursor-not-allowed');
                } else {
                    btn.classList.remove('opacity-40', 'cursor-not-allowed');
                }
            });

            if(disable) {
                input.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                input.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        window.flipCoin = async function() {
            if(isFlipping) return;
            let bet = parseFloat(document.getElementById('betAmount').value);
            
            if(!bet || bet < 10) { 
                showVipToast("Invalid Bet", "Minimum bet amount is ₹10", "error"); 
                return; 
            }
            if(bet > userBalance) { 
                showVipToast("Low Balance", "Insufficient wallet balance to place bet!", "error"); 
                return; 
            }

            toggleControls(true);
            userBalance -= bet;
            await update(ref(db, `users/${currentUser.uid}`), { balance: userBalance });

            document.getElementById('resultText').innerHTML = `<span class="text-amber-400">Flipping coin...</span>`;

            let outcome = Math.random() < 0.60 ? (selectedChoice === 'HEADS' ? 'TAILS' : 'HEADS') : selectedChoice;
            const coin = document.getElementById('coinContainer');
            coin.style.transform = "rotateY(1080deg)";

            setTimeout(async () => {
                coin.style.transform = outcome === 'HEADS' ? "rotateY(0deg)" : "rotateY(180deg)";
                let isWin = (outcome === selectedChoice);
                
                if(isWin) {
                    let winAmount = bet * 1.85; 
                    userBalance += winAmount;
                    await update(ref(db, `users/${currentUser.uid}`), { balance: userBalance });
                    showVipToast("Big Win!", `Won ₹${winAmount.toFixed(2)}! Coin landed on ${outcome}`, "success");
                    document.getElementById('resultText').innerHTML = `<span class="text-emerald-400">🎉 Won ₹${winAmount.toFixed(2)}! Coin landed on ${outcome}</span>`;
                } else {
                    showVipToast("Round Lost", `Coin landed on ${outcome}. Better luck next time!`, "error");
                    document.getElementById('resultText').innerHTML = `<span class="text-red-400">💥 Lost! Coin landed on ${outcome}</span>`;
                }
                
                toggleControls(false);
            }, 1000);
        }
    </script>
</body>
</html>
