<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - Minesweeper Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #030712; color: #fff; user-select: none; }
        .cyber-panel { background: linear-gradient(135deg, #0f172a 0%, #030712 100%); border: 1px solid rgba(59, 130, 246, 0.3); box-shadow: 0 0 30px rgba(59, 130, 246, 0.08); }
        .neon-number { text-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-6">

    <!-- Header -->
    <header class="bg-[#030712]/95 backdrop-blur-md border-b border-blue-500/20 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='dashboard.html'" class="w-9 h-9 rounded-xl bg-slate-800/80 flex items-center justify-center font-bold text-white hover:bg-slate-700">←</button>
            <div class="flex items-center gap-2">
               <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-blue-500 to-cyan-500 flex items-center justify-center text-xs shadow-md shadow-blue-500/30">⚡</div>
               <div>
                   <h2 class="text-xs font-black text-blue-400 uppercase tracking-wider">Minesweeper Elite</h2>
                   <span class="text-[10px] text-cyan-300 font-semibold">● Quantum Hi-Lo Protocol</span>
               </div>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-slate-900/90 border border-blue-500/30 px-3.5 py-1.5 rounded-full shadow-inner">
            <span class="text-[10px] uppercase font-bold text-slate-400">Bal:</span>
            <span id="userBalance" class="text-xs font-black text-emerald-400">₹0.00</span>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="max-w-md mx-auto w-full p-4 flex flex-col space-y-4">
        <div class="cyber-panel rounded-3xl p-5 text-center space-y-4">
            <div class="flex justify-between items-center px-1">
                <div id="gameStatus" class="text-[10px] font-extrabold text-blue-400 uppercase tracking-widest">PREDICT NEXT QUANTUM CODE</div>
                <div id="scoreDisplay" class="text-xs font-black text-emerald-400">1.00x</div>
            </div>

            <!-- Number Display Box -->
            <div class="py-8 bg-slate-950/80 rounded-2xl border border-blue-500/30 relative overflow-hidden flex flex-col items-center justify-center shadow-inner">
                <span class="text-[10px] text-slate-400 uppercase font-bold mb-1">Current Code Number</span>
                <span id="currentNumber" class="text-6xl font-black text-blue-400 neon-number">--</span>
                <span id="subStatus" class="text-[11px] text-slate-400 mt-2 font-medium">Guess if next code is Higher or Lower</span>
            </div>

            <div class="flex justify-between items-center text-[10px] text-slate-400 px-1 font-bold">
                <span class="text-amber-400">House Edge Active</span>
                <span id="potentialWin" class="text-blue-300">Win: ₹0.00</span>
            </div>
        </div>

        <!-- Gameplay Action Buttons (Hidden until game starts) -->
        <div id="actionControls" class="grid grid-cols-2 gap-3 hidden">
            <button onclick="makeGuess('higher')" class="py-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-white font-black text-xs uppercase tracking-widest shadow-lg shadow-emerald-500/30 transition-all">HIGHER 📈</button>
            <button onclick="makeGuess('lower')" class="py-4 rounded-2xl bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 text-white font-black text-xs uppercase tracking-widest shadow-lg shadow-rose-500/30 transition-all">LOWER 📉</button>
        </div>

        <!-- Betting Controls -->
        <div class="cyber-panel rounded-3xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-300 uppercase">Bet Amount (₹)</span>
                <div class="flex gap-1">
                    <button onclick="setBet(50)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-blue-400">50</button>
                    <button onclick="setBet(100)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-blue-400">100</button>
                    <button onclick="setBet(500)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-blue-400">500</button>
                </div>
            </div>
            <input type="number" id="betAmount" value="100" class="w-full bg-[#030712] border border-blue-500/30 rounded-2xl px-4 py-3 text-xs text-white font-bold focus:outline-none focus:border-blue-500">

            <div class="grid grid-cols-2 gap-2">
                <button id="startBtn" onclick="startGame()" class="py-3.5 rounded-2xl bg-gradient-to-r from-blue-500 to-cyan-600 hover:from-blue-400 text-slate-950 font-black text-xs uppercase tracking-widest shadow-lg shadow-blue-500/30 transition-all">START GAME</button>
                <button id="cashoutBtn" onclick="cashOut()" disabled class="py-3.5 rounded-2xl bg-slate-800 text-slate-500 font-black text-xs uppercase tracking-widest cursor-not-allowed transition-all">COLLECT</button>
            </div>
        </div>
    </main>

    <!-- Firebase & Game Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ",
            authDomain: "nexuswin-aa829.firebaseapp.com",
            databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com",
            projectId: "nexuswin-aa829",
            storageBucket: "nexuswin-aa829.firebasestorage.app",
            messagingSenderId: "865579357605",
            appId: "1:865579357605:web:7af15e869ce54756a8844c",
            measurementId: "G-NTZY5VKYP0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let userBalance = 0;
        let activeBet = 0;
        let gameActive = false;
        let currentNum = 50;
        let scoreMultiplier = 1.00;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                onValue(ref(db, 'users/' + user.uid), (snap) => {
                    if(snap.exists() && snap.val().balance !== undefined) {
                        userBalance = snap.val().balance;
                        document.getElementById('userBalance').innerText = `₹${userBalance.toFixed(2)}`;
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });

        window.setBet = (amt) => { 
            if(gameActive) return;
            document.getElementById('betAmount').value = amt; 
        }

        window.startGame = async function() {
            if(gameActive) return;
            activeBet = parseFloat(document.getElementById('betAmount').value);
            if(!activeBet || activeBet < 10) { alert("Minimum bet ₹10"); return; }
            if(activeBet > userBalance) { alert("Insufficient balance!"); return; }

            userBalance -= activeBet;
            await update(ref(db, `users/${currentUser.uid}`), { balance: userBalance });

            gameActive = true;
            scoreMultiplier = 1.00;
            currentNum = Math.floor(Math.random() * 80) + 10; // Random start between 10 and 90

            document.getElementById('currentNumber').innerText = currentNum;
            document.getElementById('scoreDisplay').innerText = `1.00x`;
            document.getElementById('potentialWin').innerText = `Win: ₹${activeBet.toFixed(2)}`;
            document.getElementById('gameStatus').innerText = "MAKE YOUR PREDICTION";
            document.getElementById('subStatus').innerText = "Choose Higher or Lower";

            document.getElementById('actionControls').classList.remove('hidden');
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').className = "py-3.5 rounded-2xl bg-slate-800 text-slate-500 font-black text-xs uppercase tracking-widest cursor-not-allowed";
            document.getElementById('cashoutBtn').disabled = false;
            document.getElementById('cashoutBtn').className = "py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 text-slate-950 font-black text-xs uppercase tracking-widest shadow-lg shadow-emerald-500/30 transition-all";
        }

        window.makeGuess = function(choice) {
            if(!gameActive) return;

            // Generate next number with built-in house edge probability skew
            let nextNum = Math.floor(Math.random() * 100) + 1;
            if(nextNum === currentNum) nextNum = (currentNum + 1) % 100; // avoid tie

            let isHigher = nextNum > currentNum;
            let playerWon = (choice === 'higher' && isHigher) || (choice === 'lower' && !isHigher);

            // Admin House Edge Check: 15% random forced loss on streaks to secure admin profit
            if(playerWon && Math.random() < 0.18 && scoreMultiplier > 1.3) {
                playerWon = false;
                nextNum = choice === 'higher' ? currentNum - Math.floor(Math.random()*10)-1 : currentNum + Math.floor(Math.random()*10)+1;
                if(nextNum < 1) nextNum = 1; if(nextNum > 100) nextNum = 100;
            }

            currentNum = nextNum;
            document.getElementById('currentNumber').innerText = currentNum;

            if(playerWon) {
                scoreMultiplier += 0.35 + (Math.random() * 0.15);
                let curWin = activeBet * scoreMultiplier;
                document.getElementById('scoreDisplay').innerText = `${scoreMultiplier.toFixed(2)}x`;
                document.getElementById('potentialWin').innerText = `Win: ₹${curWin.toFixed(2)}`;
                document.getElementById('gameStatus').innerText = "SUCCESS! PREDICT NEXT";
            } else {
                gameOver();
            }
        }

        window.cashOut = async function() {
            if(!gameActive) return;
            gameActive = false;

            let winAmt = activeBet * scoreMultiplier;
            userBalance += winAmt;
            await update(ref(db, `users/${currentUser.uid}`), { balance: userBalance });

            document.getElementById('gameStatus').innerText = `COLLECTED: +₹${winAmt.toFixed(2)}`;
            document.getElementById('subStatus').innerText = "Session Completed Securely";
            resetControls();
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('gameStatus').innerText = "WRONG PREDICTION! ADMIN WINS";
            document.getElementById('subStatus').innerText = `Code landed incorrectly`;
            resetControls();
        }

        function resetControls() {
            document.getElementById('actionControls').classList.add('hidden');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').className = "py-3.5 rounded-2xl bg-gradient-to-r from-blue-500 to-cyan-600 hover:from-blue-400 text-slate-950 font-black text-xs uppercase tracking-widest shadow-lg shadow-blue-500/30 transition-all";
            document.getElementById('cashoutBtn').disabled = true;
            document.getElementById('cashoutBtn').className = "py-3.5 rounded-2xl bg-slate-800 text-slate-500 font-black text-xs uppercase tracking-widest cursor-not-allowed transition-all";
        }
    </script>
</body>
</html>
