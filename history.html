<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - Transaction History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel {
            background: rgba(13, 17, 28, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen p-4 pb-24">

    <!-- Top Navigation Bar -->
    <header class="max-w-md mx-auto glass-panel rounded-2xl px-4 py-3.5 flex items-center justify-between border border-slate-800 mb-6">
        <button onclick="window.location.href='dashboard.html'" class="text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1">← Back to Lobby</button>
        <h1 class="text-xs font-black text-white uppercase tracking-wider">Transaction Ledger</h1>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto space-y-6">

        <!-- Deposits History Card -->
        <div class="glass-panel rounded-3xl p-5 border border-slate-800">
            <h2 class="text-xs font-extrabold text-emerald-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                <span>📥</span> Deposit Records
            </h2>
            <div id="userDepositsList" class="space-y-2.5">
                <p class="text-xs text-slate-500 text-center py-3">Loading deposits...</p>
            </div>
        </div>

        <!-- Withdrawals History Card -->
        <div class="glass-panel rounded-3xl p-5 border border-slate-800">
            <h2 class="text-xs font-extrabold text-indigo-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                <span>📤</span> Withdrawal Records
            </h2>
            <div id="userWithdrawalsList" class="space-y-2.5">
                <p class="text-xs text-slate-500 text-center py-3">Loading withdrawals...</p>
            </div>
        </div>
    </main>

    <!-- Firebase History Fetch Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ",
            authDomain: "nexuswin-aa829.firebaseapp.com",
            databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com",
            projectId: "nexuswin-aa829",
            storageBucket: "nexuswin-aa829.firebasestorage.app",
            messagingSenderId: "865579357605",
            appId: "1:865579357605:web:7af15e869ce54756a8844c",
            measurementId: "G-NTZY5VKYP0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                fetchUserHistory(user.uid);
            } else {
                window.location.href = "index.html";
            }
        });

        function fetchUserHistory(uid) {
            // Fetch User Deposits
            const depRef = ref(db, 'transactions/deposits');
            onValue(depRef, (snapshot) => {
                const container = document.getElementById('userDepositsList');
                container.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    container.innerHTML = `<p class="text-xs text-slate-500 text-center py-3">No deposit history found.</p>`;
                    return;
                }

                let found = false;
                Object.keys(data).forEach(key => {
                    const req = data[key];
                    if (req.uid === uid) {
                        found = true;
                        const statusColor = req.status === 'Approved' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : req.status === 'Rejected' ? 'text-rose-400 bg-rose-500/10 border-rose-500/20' : 'text-amber-400 bg-amber-500/10 border-amber-500/20';
                        
                        container.innerHTML += `
                            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
                                <div>
                                    <p class="text-xs font-black text-white">₹${req.amount}</p>
                                    <p class="text-[10px] text-slate-400 font-mono mt-0.5">UTR: ${req.utr}</p>
                                </div>
                                <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-lg border ${statusColor}">${req.status}</span>
                            </div>
                        `;
                    }
                });

                if (!found) {
                    container.innerHTML = `<p class="text-xs text-slate-500 text-center py-3">No deposit records yet.</p>`;
                }
            });

            // Fetch User Withdrawals
            const witRef = ref(db, 'transactions/withdrawals');
            onValue(witRef, (snapshot) => {
                const container = document.getElementById('userWithdrawalsList');
                container.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    container.innerHTML = `<p class="text-xs text-slate-500 text-center py-3">No withdrawal history found.</p>`;
                    return;
                }

                let found = false;
                Object.keys(data).forEach(key => {
                    const req = data[key];
                    if (req.uid === uid) {
                        found = true;
                        const statusColor = req.status === 'Approved' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : req.status === 'Rejected' ? 'text-rose-400 bg-rose-500/10 border-rose-500/20' : 'text-amber-400 bg-amber-500/10 border-amber-500/20';

                        container.innerHTML += `
                            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
                                <div>
                                    <p class="text-xs font-black text-white">₹${req.amount}</p>
                                    <p class="text-[10px] text-slate-400 font-mono mt-0.5">UPI: ${req.upi}</p>
                                </div>
                                <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-lg border ${statusColor}">${req.status}</span>
                            </div>
                        `;
                    }
                });

                if (!found) {
                    container.innerHTML = `<p class="text-xs text-slate-500 text-center py-3">No withdrawal records yet.</p>`;
                }
            });
        }
    </script>
